<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PDF Renderer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  body { margin: 0; padding: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="pdf-canvas"></canvas>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  
  async function renderPDF() {
    const loadingTask = pdfjsLib.getDocument('invoice-ref.pdf');
    const pdf = await loadingTask.promise;
    const page = await pdf.getPage(1);
    
    const scale = 2; // High resolution
    const viewport = page.getViewport({ scale });
    const canvas = document.getElementById('pdf-canvas');
    const context = canvas.getContext('2d');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    
    await page.render({ canvasContext: context, viewport }).promise;
    
    // Extract header colors
    const imgData = context.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    const w = canvas.width;
    
    const samples = [
      {x: 0.1, y: 0.03, label: 'top-1%'},
      {x: 0.5, y: 0.03, label: 'top-center-3%'},
      {x: 0.9, y: 0.03, label: 'top-right-3%'},
      {x: 0.05, y: 0.08, label: 'header-left-8%'},
      {x: 0.5, y: 0.08, label: 'header-center-8%'},
      {x: 0.95, y: 0.08, label: 'header-right-8%'},
      {x: 0.05, y: 0.12, label: 'header-left-12%'},
      {x: 0.5, y: 0.12, label: 'header-center-12%'},
      {x: 0.95, y: 0.12, label: 'header-right-12%'},
      {x: 0.05, y: 0.18, label: 'body-left-18%'},
      {x: 0.5, y: 0.18, label: 'body-center-18%'},
      {x: 0.95, y: 0.18, label: 'body-right-18%'},
      {x: 0.5, y: 0.35, label: 'mid-page'},
      {x: 0.5, y: 0.55, label: 'lower-page'},
      {x: 0.5, y: 0.85, label: 'footer'},
    ];
    
    const results = [];
    samples.forEach(s => {
      const px = Math.floor(s.x * w);
      const py = Math.floor(s.y * canvas.height);
      const idx = (py * w + px) * 4;
      const r = data[idx], g = data[idx+1], b = data[idx+2];
      const hex = '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
      results.push({ label: s.label, x: s.x, y: s.y, rgb: `${r},${g},${b}`, hex });
    });
    
    console.log('COLOR_DATA:' + JSON.stringify(results));
    document.title = 'RENDER_DONE';
  }
  
  renderPDF().catch(e => { document.title = 'RENDER_ERROR'; console.log('ERROR:' + e.message); });
</script>
</body>
</html>
